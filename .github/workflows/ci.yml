name: Python checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: make install
      - run: make check
      - run: make demo
      - run: make forward-demo
      - run: make ibkr-demo
      - run: make build
      - name: Pass source code to the deployment job
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error
