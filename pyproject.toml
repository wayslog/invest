[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wayslog-invest"
version = "0.7.1"
description = "A personal research framework for US equity investing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.5,<5",
    "filelock>=3.17,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=19,<25",
]

[project.scripts]
invest = "invest.cli:main"
invest-ibkr = "invest.ibkr_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
]
research = [
    "alphalens-reloaded==0.5.0",
    "pyqlib==0.9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invest"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/configs",
    "/deploy",
    "/integrations",
    "/pyproject.toml",
    "/README.md",
    "/Makefile",
    "/uv.lock",
    "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["invest"]
patch = ["subprocess"]
# The engine-binding regression executes an intentionally modified package copy.
omit = ["*/changed-engine/invest/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
untyped_calls_exclude = ["pyarrow", "qlib", "alphalens"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*", "qlib", "qlib.*", "alphalens", "alphalens.*"]
ignore_missing_imports = true
